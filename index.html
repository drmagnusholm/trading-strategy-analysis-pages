<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trading Strategy Analysis Studio</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gridstack@12.2.1/dist/gridstack.min.css">
    <script src="https://cdn.jsdelivr.net/npm/gridstack@12.2.1/dist/gridstack-all.min.js"></script>
    <!-- Gridstack CSS 
    <link href="../../../node_modules/gridstack/dist/gridstack.min.css" rel="stylesheet" />
    <link href="../../../node_modules/gridstack/dist/gridstack-extra.min.css" rel="stylesheet" />
    <script src="../../../node_modules/gridstack/dist/gridstack-all.js"></script>
     Optional custom CSS -->
    <style>
        :root {
            --ink: #152033;
            --muted: #617086;
            --subtle: #8a97aa;
            --line: #d9e1ec;
            --surface: #ffffff;
            --surface-2: #f7f9fc;
            --page: #edf2f7;
            --blue: #244f8c;
            --blue-2: #3c7bad;
            --green: #007700;
            --red: #770000;
            --violet: #440088;
            --magenta: #aa00aa;
            --shadow: 0 20px 55px rgba(35, 49, 75, 0.13);
            --soft-shadow: 0 8px 22px rgba(35, 49, 75, 0.08);
            --table-font-size: 12px;
            --table-line-height: 1.4;
            --table-cell-padding-y: 7px;
            --table-cell-padding-x: 9px;
        }

        * {
            box-sizing: border-box;
        }

        html {
            background: var(--page);
        }

        body {
            margin: 0;
            min-width: 320px;
            color: var(--ink);
            background:
                linear-gradient(180deg, #f9fbfe 0, #edf2f7 410px, #edf2f7 100%);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 14px;
            letter-spacing: 0;
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
        }

        button {
            border: 0;
        }

        .app-shell {
            width: min(1720px, calc(100% - 32px));
            margin: 0 auto;
            padding: 24px 0 42px;
        }

        .analysis-workspace {
            display: grid;
            grid-template-columns: 330px minmax(0, 1fr);
            gap: 8px;
            align-items: start;
        }

        .analysis-controls {
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: sticky;
            top: 12px;
            max-height: calc(100vh - 24px);
            overflow-y: auto;
            scrollbar-gutter: stable;
            padding: 12px 0;
            min-width: 0;
        }

        .control-panel { flex: 0 0 auto; min-width: 0; }
        .control-panel .panel-header { flex-wrap: wrap; }
        .control-panel .slider-card { display: flex; flex-direction: column; gap: 16px; }
        #simple-grid { min-width: 0; }

        .app-header {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 18px;
            align-items: end;
            padding: 4px 4px 18px;
        }

        .eyebrow,
        .panel-kicker {
            margin: 0 0 6px;
            color: var(--blue);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: .12em;
            text-transform: uppercase;
        }

        h1,
        h2,
        h3,
        p {
            margin: 0;
        }

        h1 {
            color: var(--ink);
            font-size: clamp(28px, 4vw, 52px);
            line-height: 1;
            letter-spacing: 0;
        }

        .app-subtitle {
            max-width: 850px;
            margin-top: 10px;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.55;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        .source-strip {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 10px;
            margin: 0 4px 16px;
        }

        .source-pill {
            min-height: 68px;
            padding: 14px 16px;
            border: 1px solid rgba(36, 79, 140, 0.12);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.78);
            box-shadow: var(--soft-shadow);
        }

        .source-pill span {
            display: block;
            color: var(--subtle);
            font-size: 11px;
            font-weight: 750;
            letter-spacing: .09em;
            text-transform: uppercase;
        }

        .source-pill strong {
            display: block;
            margin-top: 6px;
            color: var(--ink);
            font-size: 16px;
            font-weight: 780;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .grid-stack {
            margin: 0;
            border-radius: 14px;
        }

        .grid-stack-item {
            background: transparent;
        }

        .grid-stack-item-content,
        .control-panel {
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow: hidden;
            padding: 18px;
            color: var(--ink);
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(255, 255, 255, 0.92));
            border: 1px solid rgba(36, 79, 140, 0.12);
            border-radius: 8px;
            box-shadow: var(--shadow);
            text-align: left;
        }

        .grid-stack-item-content::-webkit-scrollbar {
            width: 9px;
            height: 9px;
        }

        .grid-stack-item-content::-webkit-scrollbar-thumb {
            border-radius: 999px;
            background: #c2cedc;
        }

        .grid-stack-placeholder > .placeholder-content {
            border-radius: 8px;
            border: 2px dashed rgba(36, 79, 140, 0.35);
            background: rgba(36, 79, 140, 0.05);
        }

        .grid-stack-item-removing {
            display: none !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }

        .panel-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 14px;
        }

        .panel-title {
            color: var(--ink);
            font-size: 18px;
            font-weight: 820;
            line-height: 1.15;
        }

        .panel-note {
            margin-top: 4px;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.35;
        }

        .tabbed-inputs {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .tabs {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 4px;
            padding: 4px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface-2);
        }

        .tab {
            min-height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 10px;
            border-radius: 6px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 780;
            cursor: pointer;
            user-select: none;
        }

        .tab.active {
            color: var(--ink);
            background: var(--surface);
            box-shadow: 0 4px 12px rgba(22, 35, 56, 0.10);
        }

        .tab-content {
            flex: 1;
            margin-top: 14px;
        }

        .tab-pane {
            display: none;
        }

        .tab-pane.active {
            display: block;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        label {
            color: var(--muted);
            font-size: 11px;
            font-weight: 760;
            letter-spacing: .06em;
            text-transform: uppercase;
        }

        input[type="text"],
        input[type="number"],
        input[type="date"],
        input[type="file"],
        select,
        textarea {
            width: 100%;
            min-height: 38px;
            padding: 9px 10px;
            color: var(--ink);
            border: 1px solid var(--line);
            border-radius: 7px;
            background: var(--surface);
            outline: none;
            transition: border-color .16s ease, box-shadow .16s ease, background .16s ease;
        }

        textarea {
            min-height: 128px;
            resize: vertical;
            line-height: 1.45;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: rgba(36, 79, 140, 0.72);
            box-shadow: 0 0 0 3px rgba(36, 79, 140, 0.12);
        }

        .check-field {
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 38px;
            padding: 9px 10px;
            border: 1px solid var(--line);
            border-radius: 7px;
            background: var(--surface);
        }

        .check-field label {
            color: var(--ink);
            letter-spacing: 0;
            text-transform: none;
        }

        .button-row {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .btn {
            min-height: 38px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 9px 13px;
            border-radius: 7px;
            background: var(--ink);
            color: #fff;
            font-weight: 760;
            cursor: pointer;
            transition: transform .16s ease, box-shadow .16s ease, background .16s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 22px rgba(21, 32, 51, 0.15);
        }

        .btn.primary {
            background: linear-gradient(135deg, var(--blue), var(--violet));
        }

        .btn.secondary {
            color: var(--ink);
            background: #e9eef5;
        }

        .status-line {
            margin-top: 10px;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.4;
        }

        .status-line.error {
            color: #a73838;
        }

        .slider-card {
            min-height: 100%;
            justify-content: space-between;
        }

        .slider-input {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 92px;
            gap: 12px;
            align-items: center;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--blue);
        }

        .slider-value-readout {
            color: var(--muted);
            font-size: 12px;
        }

        .gauge-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 10px;
        }

        .gauge-panel { display: flex; flex-direction: column; gap: 14px; min-width: 0; padding: 18px; }
        [gs-id="risk-gauge-widget"] > .grid-stack-item-content { padding: 0; }

        .gauge-card {
            min-width: 0;
            min-height: 142px;
            padding: 10px;
            border: 1px solid rgba(36, 79, 140, 0.10);
            border-radius: 8px;
            background:
                radial-gradient(circle at 50% 0, rgba(60, 123, 173, 0.12), transparent 45%),
                #fbfdff;
        }

        .gauge-card svg {
            display: block;
            width: 100%;
            height: 100px;
        }

        .gauge-label {
            margin-top: -4px;
            color: var(--muted);
            font-size: 11px;
            font-weight: 760;
            letter-spacing: .06em;
            text-align: center;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .plot-host {
            flex: 1 1 auto;
            display: flex;
            align-items: stretch;
            justify-content: stretch;
            min-height: 0;
            width: 100%;
            overflow: hidden;
        }

        .plot-host > svg,
        .plot-host > figure {
            flex: 1 1 auto;
            width: 100%;
            height: 100%;
            min-width: 0;
            min-height: 0;
        }

        figure {
            width: 100%;
            margin: 0;
        }

        figure svg,
        .plot-host > svg {
            display: block;
            width: 100%;
            max-width: 100%;
            height: 100%;
            overflow: visible;
            font-family: inherit;
        }

        figcaption {
            color: var(--muted);
            font-size: 11px;
            line-height: 1.4;
        }

        .table-wrap {
            flex: 1 1 auto;
            min-height: 0;
            width: 100%;
            overflow: auto;
        }

        .parameter-label {
            color: var(--ink);
            font-weight: 800;
        }

        .highlight-cell {
            color: var(--blue);
            font-weight: 850;
            background: rgba(36, 79, 140, 0.07);
        }

        @media screen and (max-width: 1180px) {
            .source-strip {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

        }

        @media screen and (max-width: 980px) {
            .analysis-workspace { grid-template-columns: minmax(0, 1fr); }
            .analysis-controls {
                position: static;
                max-height: none;
                overflow: visible;
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                align-items: start;
                padding: 0 12px;
            }
        }

        @media screen and (max-width: 740px) {
            .app-shell {
                width: min(100% - 18px, 720px);
                padding-top: 14px;
            }

            .app-header {
                grid-template-columns: 1fr;
                align-items: start;
            }

            .header-actions {
                justify-content: flex-start;
            }

            .source-strip,
            .form-grid,
            .analysis-controls {
                grid-template-columns: 1fr;
            }

            .gauge-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }

            .slider-input {
                grid-template-columns: 1fr;
            }

            .grid-stack-item-content,
            .control-panel {
                padding: 15px;
            }
        }

        @page {
            size: A4;
            margin: 12mm;
        }

        @media print {
            html,
            body {
                width: auto;
                min-width: 0;
                max-width: 100%;
                background: #fff;
            }

            body {
                color: #111827;
                font-size: 10pt;
            }

            .app-shell {
                width: 100%;
                max-width: none;
                margin: 0;
                /* Allow for fractional CSS-pixel rounding at the printer's content edge. */
                padding: 0 1mm;
            }

            .analysis-workspace { display: block; }

            .no-print,
            .tabbed-inputs,
            .slider-card {
                display: none !important;
            }

            .app-header {
                display: block;
                padding: 0 0 8mm;
            }

            h1 {
                font-size: 24pt;
            }

            .app-subtitle {
                font-size: 9.5pt;
            }

            .source-strip {
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: 4mm;
                margin: 0 0 6mm;
            }

            .source-pill,
            .grid-stack-item-content {
                box-shadow: none;
                border-color: #cbd5e1;
                background: #fff;
            }

            .source-pill { min-width: 0; padding: 3mm; }
            .source-pill strong { white-space: normal; overflow: visible; text-overflow: clip; overflow-wrap: anywhere; font-size: 10pt; }

            .grid-stack {
                display: block !important;
                width: 100% !important;
                max-width: 100% !important;
                height: auto !important;
            }

            .grid-stack-item {
                position: static !important;
                width: 100% !important;
                max-width: 100% !important;
                height: auto !important;
                min-height: 0 !important;
                transform: none !important;
                left: auto !important;
                top: auto !important;
                margin: 0 0 5mm !important;
                page-break-inside: avoid;
                break-inside: avoid;
            }

            .grid-stack-item-content {
                position: static !important;
                inset: auto !important;
                width: auto !important;
                max-width: 100% !important;
                height: auto !important;
                min-height: 0 !important;
                overflow: visible !important;
                padding: 4mm;
                page-break-inside: avoid;
                break-inside: avoid;
                -webkit-box-decoration-break: clone;
                box-decoration-break: clone;
            }

            .gauge-grid {
                grid-template-columns: repeat(4, minmax(0, 1fr));
            }

            .gauge-card {
                min-height: 33mm;
                background: #fff;
            }

            .gauge-panel { padding: 4mm; }

            .plot-host {
                min-height: 0;
            }

            figure svg {
                max-height: 94mm;
            }

        }
    </style>

</head>

<body>
    <main class="app-shell">
        <header class="app-header">
            <div>
                <p class="eyebrow">Returns · Risk · Statistical Confidence</p>
                <h1>Trading Strategy Analysis</h1>
                <p class="app-subtitle">
                    Compare strategy returns, risk, uncertainty, and serial dependence. Explore leverage and Kelly sizing
                    across simulated, pasted, uploaded, or Binance-sourced histories.
                </p>
            </div>
            <div class="header-actions no-print">
                <button class="btn secondary" type="button" id="reset-layout">Reset layout</button>
                <button class="btn primary" type="button" id="print-analysis">Print A4</button>
            </div>
        </header>

        <section class="source-strip" id="source-summary" aria-label="Current analysis source">
            <div class="source-pill"><span>Source</span><strong id="summary-source">Sample model</strong></div>
            <div class="source-pill"><span>Observations</span><strong id="summary-observations">-</strong></div>
            <div class="source-pill"><span>Ticks / year</span><strong id="summary-tpy">-</strong></div>
            <div class="source-pill"><span>Date range</span><strong id="summary-range">-</strong></div>
        </section>

        <div class="analysis-workspace">
            <aside id="analysis-controls" class="analysis-controls no-print" aria-label="Analysis controls"></aside>
            <div id="simple-grid" class="grid-stack"></div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="https://cdn.jsdelivr.net/npm/@observablehq/plot@0.6"></script>
    <script src="https://unpkg.com/mathjs@13.0.3/lib/browser/math.js"></script>
    <script>
        //+----------------------------------------------------+
        //|                    Import Gauge                    |
        //+----------------------------------------------------+
        /* global window, define, module */
        (function (global, factory) {
            var Gauge = factory(global);
            if (typeof define === "function" && define.amd) {
                // AMD support
                define(function () { return Gauge; });
            } else if (typeof module === "object" && module.exports) {
                // CommonJS support
                module.exports = Gauge;
            } else {
                // We are probably running in the browser
                global.Gauge = Gauge;
            }
        })(typeof window === "undefined" ? this : window, function (global, undefined) {

            var document = global.document,
                slice = Array.prototype.slice,
                requestAnimationFrame = (global.requestAnimationFrame ||
                    global.mozRequestAnimationFrame ||
                    global.webkitRequestAnimationFrame ||
                    global.msRequestAnimationFrame ||
                    function (cb) {
                        return setTimeout(cb, 1000 / 60);
                    });

            // EXPERIMENTAL!!
            /**
             * Simplistic animation function for animating the gauge. That's all!
             * Options are:
             * {
             *  duration: 1,    // In seconds
             *  start: 0,       // The start value
             *  end: 100,       // The end value
             *  step: function, // REQUIRED! The step function that will be passed the value and does something
             *  easing: function // The easing function. Default is easeInOutCubic
             * }
             */
            function Animation(options) {
                var duration = options.duration,
                    currentIteration = 1,
                    iterations = 60 * duration,
                    start = options.start || 0,
                    end = options.end,
                    change = end - start,
                    step = options.step,
                    easing = options.easing || function easeInOutCubic(pos) {
                        // https://github.com/danro/easing-js/blob/master/easing.js
                        if ((pos /= 0.5) < 1) return 0.5 * Math.pow(pos, 3);
                        return 0.5 * (Math.pow((pos - 2), 3) + 2);
                    };

                function animate() {
                    var progress = currentIteration / iterations,
                        value = change * easing(progress) + start;
                    // console.log(progress + ", " + value);
                    step(value, currentIteration);
                    currentIteration += 1;

                    if (progress < 1) {
                        requestAnimationFrame(animate);
                    }
                }
                // start!
                requestAnimationFrame(animate);
            }



            var Gauge = (function () {
                var SVG_NS = "http://www.w3.org/2000/svg";

                var GaugeDefaults = {
                    centerX: 50,
                    centerY: 50
                };

                var defaultOptions = {
                    dialRadius: 40,
                    dialStartAngle: 135,
                    dialEndAngle: 45,
                    value: 0,
                    max: 100,
                    min: 0,
                    valueDialClass: "value",
                    valueClass: "value-text",
                    dialClass: "dial",
                    gaugeClass: "gauge",
                    showValue: true,
                    gaugeColor: null,
                    label: function (val) { return Math.round(val); }
                };

                function shallowCopy(/* source, ...targets*/) {
                    var target = arguments[0], sources = slice.call(arguments, 1);
                    sources.forEach(function (s) {
                        for (k in s) {
                            if (s.hasOwnProperty(k)) {
                                target[k] = s[k];
                            }
                        }
                    });
                    return target;
                }

                /**
                 * A utility function to create SVG dom tree
                 * @param {String} name The SVG element name
                 * @param {Object} attrs The attributes as they appear in DOM e.g. stroke-width and not strokeWidth
                 * @param {Array} children An array of children (can be created by this same function)
                 * @return The SVG element
                 */
                function svg(name, attrs, children) {
                    var elem = document.createElementNS(SVG_NS, name);
                    for (var attrName in attrs) {
                        elem.setAttribute(attrName, attrs[attrName]);
                    }

                    if (children) {
                        children.forEach(function (c) {
                            elem.appendChild(c);
                        });
                    }
                    return elem;
                }

                /**
                 * Translates percentage value to angle. e.g. If gauge span angle is 180deg, then 50%
                 * will be 90deg
                 */
                function getAngle(percentage, gaugeSpanAngle) {
                    return percentage * gaugeSpanAngle / 100;
                }

                function normalize(value, min, limit) {
                    var val = Number(value);
                    if (val > limit) return limit;
                    if (val < min) return min;
                    return val;
                }

                function getValueInPercentage(value, min, max) {
                    var newMax = max - min, newVal = value - min;
                    return 100 * newVal / newMax;
                    // var absMin = Math.abs(min);
                    // return 100 * (absMin + value) / (max + absMin);
                }

                /**
                 * Gets cartesian co-ordinates for a specified radius and angle (in degrees)
                 * @param cx {Number} The center x co-oriinate
                 * @param cy {Number} The center y co-ordinate
                 * @param radius {Number} The radius of the circle
                 * @param angle {Number} The angle in degrees
                 * @return An object with x,y co-ordinates
                 */
                function getCartesian(cx, cy, radius, angle) {
                    var rad = angle * Math.PI / 180;
                    return {
                        x: Math.round((cx + radius * Math.cos(rad)) * 1000) / 1000,
                        y: Math.round((cy + radius * Math.sin(rad)) * 1000) / 1000
                    };
                }

                // Returns start and end points for dial
                // i.e. starts at 135deg ends at 45deg with large arc flag
                // REMEMBER!! angle=0 starts on X axis and then increases clockwise
                function getDialCoords(radius, startAngle, endAngle) {
                    var cx = GaugeDefaults.centerX,
                        cy = GaugeDefaults.centerY;
                    return {

                            "A", radius, radius, 0, largeArcFlag, 1, end.x, end.y
                        ].join(" ");
                    }

                    function initializeGauge(elem) {
                        gaugeValueElem = svg("text", {
                            x: 50,
                            y: 50,
                            fill: "#999",
                            "class": valueTextClass,
                            "font-size": "100%",

                            "font-weight": "normal",
                            "text-anchor": "middle",
                            "alignment-baseline": "middle",
                            "dominant-baseline": "central"

                            "class": valueDialClass,
                            fill: "none",
                            stroke: "#666",
                            "stroke-width": 2.5,
                            d: pathString(radius, startAngle, startAngle) // value of 0
                        });

                        var flag = angle <= 180 ? 0 : 1;
                        var gaugeElement = svg("svg", { "viewBox": viewBox || "0 0 100 100", "class": gaugeClass },
                            [
                                svg("path", {
                                    "class": dialClass,
                                    fill: "none",
                                    stroke: "#eee",
                                    "stroke-width": 2,
                                    d: pathString(radius, startAngle, endAngle, flag)
                                }),
                                gaugeValueElem,
                                gaugeValuePath
                            ]
                        );
                        elem.appendChild(gaugeElement);
                    }

                    function updateGauge(theValue, frame) {
                        var val = getValueInPercentage(theValue, min, limit),
                            // angle = getAngle(val, 360 - Math.abs(endAngle - startAngle)),
                            angle = getAngle(val, 360 - Math.abs(startAngle - endAngle)),
                            // this is because we are using arc greater than 180deg
                            flag = angle <= 180 ? 0 : 1;
                        if (displayValue) {
                            gaugeValueElem.textContent = label.call(opts, theValue);
                        }
                        gaugeValuePath.setAttribute("d", pathString(radius, startAngle, angle + startAngle, flag));
                    }

                    function setGaugeColor(value, duration) {
                        var c = gaugeColor(value),
                            dur = duration * 1000,
                            pathTransition = "stroke " + dur + "ms ease";
                        // textTransition = "fill " + dur + "ms ease";

                        gaugeValuePath.style = [
                            "stroke: " + c,
                            "-webkit-transition: " + pathTransition,
                            "-moz-transition: " + pathTransition,
                            "transition: " + pathTransition,
                        ].join(";");
                        /*
                        gaugeValueElem.style = [
                          "fill: " + c,
                          "-webkit-transition: " + textTransition,
                          "-moz-transition: " + textTransition,
                          "transition: " + textTransition,
                        ].join(";");
                        */
                    }

                    instance = {
                        setMaxValue: function (max) {
                            limit = max;
                        },
                        setValue: function (val) {
                            value = normalize(val, min, limit);
                            if (gaugeColor) {
                                setGaugeColor(value, 0)
                            }
                            updateGauge(value);
                        },
                        setValueAnimated: function (val, duration) {
                            var oldVal = value;
                            value = normalize(val, min, limit);
                            if (oldVal === value) {
                                return;
                            }

                            if (gaugeColor) {

                            }

                                start: oldVal || 0,
                                end: value,
                                duration: duration || 1,
                                step: function (val, frame) {
                                    updateGauge(val, frame);
                                }
                            });
                        },
                        getValue: function () {
                            return value;
                        }
                    };

                    initializeGauge(gaugeContainer);
                    instance.setValue(value);
                    return instance;
                };
            })();

            return Gauge;
        });

        function debounce(func, delay) {
            // A timer variable to track the delay period
            let timer;
            // Return a function that takes arguments
            return function (...args) {
                // Clear the previous timer if any
                clearTimeout(timer);
                // Set a new timer that will execute the function after the delay period
                timer = setTimeout(() => {
                    // Apply the function with arguments
                    func.apply(this, args);
                }, delay);
            };
        }
        function throttle(func, interval) {
            // A flag variable to track whether the function is running or not
            let isRunning = false;
            // Return a function that takes arguments
            return function (...args) {
                // If the function is not running
                if (!isRunning) {
                    // Set the flag to true
                    isRunning = true;
                    // Apply the function with arguments
                    func.apply(this, args);
                    // Set a timer that will reset the flag after the interval
                    setTimeout(() => {
                        // Set the flag to false
                        isRunning = false;
                    }, interval);
                }
            };
        }
        function throttleDebounce(func, delay) {
            let timeoutId;
            let lastCall = 0;
            let lastArgs;

            return function (...args) {
                const now = Date.now();
                lastArgs = args;
                const remaining = delay - (now - lastCall);

                // Clear the debounce timeout
                clearTimeout(timeoutId);

                if (remaining <= 0) {
                    // Throttle: Execute immediately
                    func.apply(this, args);
                    lastCall = now;
                } else {

                    // Debounce: Schedule the last call to be executed after the delay
                    timeoutId = setTimeout(() => {
                        func.apply(this, lastArgs);
                        lastCall = Date.now();
                    }, delay);
                }
            };

        /**
 * Computes the quantile (inverse CDF) of the normal distribution.
 * @param {number} p - The probability (0 < p < 1).
 * @param {number} mean - The mean (μ) of the normal distribution.
 * @param {number} stdDev - The standard deviation (σ) of the normal distribution.
 * @returns {number} The quantile corresponding to the probability p.
 */
        function normalQuantile(p, mean, stdDev) {
            if (p <= 0 || p >= 1) {
                throw new Error('The probability p must be between 0 and 1 (exclusive).');
            }

            // Coefficients in rational approximations
            const a = [
                -3.969683028665376e+01,
                2.209460984245205e+02,
                -2.759285104469687e+02,
                1.383577518672690e+02,
                -3.066479806614716e+01,
                2.506628277459239e+00
            ];

            const b = [
                -5.447609879822406e+01,
                1.615858368580409e+02,
                -1.556989798598866e+02,
                6.680131188771972e+01,
                -1.328068155288572e+01
            ];

            const c = [
                -7.784894002430293e-03,
                -3.223964580411365e-01,
                -2.400758277161838e+00,
                -2.549732539343734e+00,
                4.374664141464968e+00,
                2.938163982698783e+00
            ];

            const d = [
                7.784695709041462e-03,
                3.224671290700398e-01,
                2.445134137142996e+00,
                3.754408661907416e+00
            ];

            // Define break-points.
            const plow = 0.02425;
            const phigh = 1 - plow;
            let q, r, x;

            if (p < plow) {
                // Rational approximation for lower region
                q = Math.sqrt(-2 * Math.log(p));
                x = (((((c[0] * q + c[1]) * q + c[2]) * q + c[3]) * q + c[4]) * q + c[5]) /
                    ((((d[0] * q + d[1]) * q + d[2]) * q + d[3]) * q + 1);
            } else if (p <= phigh) {
                // Rational approximation for central region
                q = p - 0.5;
                r = q * q;
                x = (((((a[0] * r + a[1]) * r + a[2]) * r + a[3]) * r + a[4]) * r + a[5]) * q /
                    (((((b[0] * r + b[1]) * r + b[2]) * r + b[3]) * r + b[4]) * r + 1);
            } else {
                // Rational approximation for upper region
                q = Math.sqrt(-2 * Math.log(1 - p));
                x = -(((((c[0] * q + c[1]) * q + c[2]) * q + c[3]) * q + c[4]) * q + c[5]) /
                    ((((d[0] * q + d[1]) * q + d[2]) * q + d[3]) * q + 1);
            }

            // Refinement using Newton-Raphson method
            for (let i = 0; i < 2; i++) {
                const err = normalCDF(x) - p;
                const pdf = (1 / Math.sqrt(2 * Math.PI)) * Math.exp(-0.5 * x * x);
                x = x - err / pdf;
            }

            // Adjust for mean and standard deviation
            return mean + stdDev * x;
        }

        /**
         * Standard normal cumulative distribution function.
         * @param {number} x
         * @returns {number} CDF value

        function normalCDF(x) {

        function erf(x) {
            // Abramowitz and Stegun formula 7.1.26
            // Absolute error less than 1.5e-7
            const sign = x >= 0 ? 1 : -1;
            x = Math.abs(x);

        const normalizeNumericToken = (rawToken) => {
            if (!rawToken) return null;
            let token = rawToken.trim().replace(/^["']|["']$/g, "");
            if (!token) return null;
            token = token.replace(/%/g, "").replace(/\s/g, "");
            if (token.includes(",") && token.includes(".")) token = token.replace(/,/g, "");
            else token = token.replace(",", ".");
            const value = Number(token);
            return Number.isFinite(value) ? value : null;
        };

        const parseNumericToken = (rawToken) => {

            if (value === null) return null;

                <details class="analysis-method"><summary>Calculation conventions</summary>
                <p>Model drift and volatility use log returns. Annual volatility uses sample standard deviation; kurtosis is Pearson (normal = 3). Gross μ/CAGR and excess μ₀/CAGR₀ coincide at the model’s zero interest rate. λ* and w₀* are the same optimal leverage; τmin and τₛ₀ both equal 1/s₀².</p>

                <p class="panel-note" id="autocorrelation-scope">Uses the strategy and resamples selected in Uncertainty Distributions.</p></div></div>
                <p class="panel-note">Aᵢⱼ = corr(rₜ₋₁ⁱ, rₜʲ): prior-return powers 1–4 against the next return and its square. Lag is one observation. Blue shows the IID bootstrap null; red marks the observed correlation.</p>
                <details class="analysis-method"><summary>p-value convention</summary><p>Matches AutoCorrelationGrid: a Gaussian kernel density with bandwidth SD/5 gives F(observed), and Holm’s p is min(F, 1 − F), the smaller single tail. The two-sided value 2 × min(F, 1 − F) is also shown. These are eight separate diagnostics without a multiple-testing correction. Powers and lag pairing follow Autocorrelations2 in the notebook.</p></details>
                <div class="analysis-scroll"><div class="diagnostic-grid" id="autocorrelation-grid"></div></div>`;

            const initialLayout = [
                { id: "return-path-widget", x: 0, y: 0, w: 6, h: 6, content: plotPanel("plotLeverageReturns", "Leverage Return Path", "Unlevered, Kelly max, and selected leverage on one return curve.") },
                { id: "risk-gauge-widget", x: 6, y: 0, w: 6, h: 6, minH: 6, sizeToContent: true, content: gaugeWidget },
                { id: "calendar-returns-widget", x: 0, y: 6, w: 12, h: 9, content: calendarWidget },
                { id: "risk-ladder-widget", x: 0, y: 15, w: 6, h: 5, content: tablePanel("output-leverage-table", "Risk Ladder", "Risk levels translated into relative leverage, absolute leverage, and theoretical return.") },
                { id: "strategy-metrics-widget", x: 6, y: 15, w: 6, h: 29, content: metricsWidget },
                { id: "recovery-window-widget", x: 0, y: 20, w: 6, h: 6, content: plotPanel("plotUnderwaterDurations", "Recovery Windows", "Top drawdown duration periods over the compounded path.") },
                { id: "underwater-depth-widget", x: 0, y: 26, w: 6, h: 6, content: plotPanel("plotUnderWater", "Underwater Depth", "Drawdown from all-time high through time.") },
                { id: "drawdown-profile-widget", x: 0, y: 32, w: 6, h: 6, content: plotPanel("plotDrawdownProfile", "Drawdown Distribution", "Empirical and theoretical depth confidence profile.") },
                { id: "duration-profile-widget", x: 0, y: 38, w: 6, h: 6, content: plotPanel("plotDrawdownTimeProfile", "Duration Distribution", "Empirical and theoretical underwater time profile.") },
                { id: "uncertainty-widget", x: 0, y: 44, w: 12, h: 20, content: uncertaintyWidget },
                { id: "autocorrelation-widget", x: 0, y: 64, w: 12, h: 18, content: autocorrelationWidget },
            ];

            let dashboardGrid;
            let isResettingLayout = false;
            const layoutCopy = () => initialLayout.map((item) => ({ ...item }));

            const gaugeFormat = {
                percent: (value) => `${value.toFixed(1)}%`,
                decimal: (value) => (value / 100).toFixed(2),
                years: (value) => `${(value / 100).toFixed(2)} y`,
                leverage: (value) => `${(value / 100).toFixed(2)}x`,
                turnover: (value) => `${value.toFixed(0)}%`,
            };

            const makeGauge = (id, options) => new ArcGauge(document.getElementById(id), options);

            const initializeGauges = () => {
                gauge1 = makeGauge("gauge1", { max: 400, value: 50, label: "mu0 drift", sublabel: "annual", format: gaugeFormat.percent, colors: ["#244f8c", "#007700", "#aa00aa"] });
                gauge2 = makeGauge("gauge2", { max: 400, value: 50, label: "sigma0 vol", sublabel: "annual", format: gaugeFormat.percent, colors: ["#244f8c", "#3c7bad", "#770000"] });
                gauge3 = makeGauge("gauge3", { max: 400, value: 50, label: "Sharpe0", sublabel: "ratio", format: gaugeFormat.decimal, colors: ["#82333f", "#3c7bad", "#007700"] });
                gauge4 = makeGauge("gauge4", { max: 400, value: 50, label: "R0 depth", sublabel: "risk", format: gaugeFormat.decimal, colors: ["#007700", "#d7b493", "#770000"] });
                gauge5 = makeGauge("gauge5", { max: 400, value: 50, label: "tau0 duration", sublabel: "years", format: gaugeFormat.years, colors: ["#244f8c", "#dcccaa", "#770000"] });
                gauge6 = makeGauge("gauge6", { max: 500, value: 50, label: "Leverage", sublabel: "absolute", format: gaugeFormat.leverage, colors: ["#244f8c", "#440088", "#aa00aa"] });
                gauge7 = makeGauge("gauge7", { max: 500, value: 50, label: "Turnover/day", sublabel: "avg abs", format: gaugeFormat.turnover, colors: ["#3c7bad", "#aa00aa", "#770000"] });
                gauge8 = makeGauge("gauge8", { max: 200, value: 50, label: "k0 Kelly", sublabel: "relative", format: gaugeFormat.decimal, colors: ["#007700", "#3c7bad", "#440088"] });
                dashboardGrid.resizeToContent(document.querySelector('[gs-id="risk-gauge-widget"]'));
            };

            const wireTabs = () => {
                document.querySelectorAll(".tab").forEach((tab) => {
                    tab.addEventListener("click", () => {
                        document.querySelectorAll(".tab").forEach((item) => item.classList.remove("active"));
                        document.querySelectorAll(".tab-pane").forEach((pane) => pane.classList.remove("active"));
                        tab.classList.add("active");
                        document.getElementById(tab.dataset.tab).classList.add("active");
                    });
                });
            };

            const hasPriceLikeHeaders = (headers) => headers.some((header) => {
                const name = normalizedHeader(header);
                return name.includes("adjclose") || name.includes("adjustedclose") || name === "close" || name.endsWith("close");
            });

            const replaceColumnOptions = (select, table, selectedValue, firstOptions = []) => {
                const options = firstOptions.map(({ value, label }) => {
                    const option = document.createElement("option");
                    option.value = value;
                    option.textContent = label;
                    return option;
                });
                table.headers.forEach((header, index) => {
                    const option = document.createElement("option");
                    option.value = String(index);
                    option.textContent = `${index + 1}: ${header}`;
                    options.push(option);
                });
                select.replaceChildren(...options);
                if ([...select.options].some((option) => option.value === selectedValue)) {
                    select.value = selectedValue;
                }
            };

            const refreshCustomColumnOptions = ({ preserve = true, autoType = false } = {}) => {
                const input = document.getElementById("custom-series-input");
                const headerMode = document.getElementById("custom-header-mode");
                const typeSelect = document.getElementById("custom-series-type");
                const valueSelect = document.getElementById("custom-value-column");
                const timeSelect = document.getElementById("custom-time-column");
                if (!input || !headerMode || !typeSelect || !valueSelect || !timeSelect) return;

                const table = parseCustomTable(input.value, headerMode.value);
                const previousValueColumn = preserve ? valueSelect.value : "auto";
                const previousTimeColumn = preserve ? timeSelect.value : "auto";

                if (autoType && hasPriceLikeHeaders(table.headers)) typeSelect.value = "price";

                const detectedTimeIndex = detectTimeColumnIndex(table, "auto");
                const detectedValueIndex = detectValueColumnIndex(table, typeSelect.value, detectedTimeIndex, "auto");
                const valueAutoLabel = table.headers[detectedValueIndex] ? `Auto: ${table.headers[detectedValueIndex]}` : "Auto detect";
                const timeAutoLabel = table.headers[detectedTimeIndex] ? `Auto: ${table.headers[detectedTimeIndex]}` : "Auto detect";

                replaceColumnOptions(valueSelect, table, previousValueColumn, [{ value: "auto", label: valueAutoLabel }]);
                replaceColumnOptions(timeSelect, table, previousTimeColumn, [
                    { value: "auto", label: timeAutoLabel },
                    { value: "none", label: "None" },
                ]);
            };

            const resetDashboardLayout = () => {
                if (!dashboardGrid) return;
                // Reset geometry while retaining inputs, names, selected portfolios and diagnostic settings.
                const inputState = [...document.querySelectorAll('#simple-grid input, #simple-grid select, #simple-grid textarea')]
                    .filter(el => el.id && el.type !== 'file')
                    .map(el => ({id:el.id, value:el.value, checked:el.checked, autoName:el.dataset.autoName}));
                isResettingLayout = true;
                dashboardGrid.removeAll(true);
                const gridElement = document.getElementById("simple-grid");
                Array.from(gridElement.children).forEach((child) => {
                    if (child.classList.contains("grid-stack-item") || child.classList.contains("grid-stack-placeholder")) {
                        child.remove();
                    }
                });
                dashboardGrid.load(layoutCopy());
                // Sidebar controls stay mounted, preserving file inputs, tab selection and listeners.
                wireStrategyAnalysis();
                syncAnalysisSelectors(analysisEntries());
                inputState.forEach(saved => {
                    const el = document.getElementById(saved.id);
                    if (!el) return;
                    el.value = saved.value;
                    if (el.type === 'checkbox') el.checked = saved.checked;
                    if (saved.autoName !== undefined) el.dataset.autoName = saved.autoName;
                });
                initializeGauges();
                requestAnimationFrame(() => {
                    isResettingLayout = false;
                    leveragePlots(currentLeverageFraction());
                });
            };

            const wireControls = (includeGlobal = true) => {
                wireStrategyAnalysis();
                const slider = document.getElementById("slider");
                const sliderValue = document.getElementById("slider-value");
                const syncSlider = (value) => {
                    const cleanValue = clamp(Number(value), 0, 200);
                    slider.value = cleanValue;
                    sliderValue.value = cleanValue;
                    updateSliderReadout();
                    throttlePlots(cleanValue / 100);
                };
                slider.addEventListener("input", () => syncSlider(slider.value));
                sliderValue.addEventListener("input", () => syncSlider(sliderValue.value));
                document.getElementById("new-sample").addEventListener("click", runSample);
                document.getElementById("analyze-custom").addEventListener("click", runCustomSeries);
                document.getElementById("load-binance-pairs").addEventListener("click", loadBinancePairs);
                document.getElementById("load-binance-series").addEventListener("click", runBinanceSeries);
                const refreshCustomColumns = debounce(() => refreshCustomColumnOptions({ preserve: true }), 120);
                document.getElementById("custom-series-input").addEventListener("input", refreshCustomColumns);
                document.getElementById("custom-header-mode").addEventListener("change", () => refreshCustomColumnOptions({ preserve: false }));
                document.getElementById("custom-series-type").addEventListener("change", () => refreshCustomColumnOptions({ preserve: true }));

                document.getElementById("file-input").addEventListener("change", (event) => {
                    const file = event.target.files?.[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = () => {
                        document.getElementById("custom-series-input").value = reader.result || "";
                        refreshCustomColumnOptions({ preserve: false, autoType: true });
                        setStatus(`Loaded ${file.name}. Choose the data type/column, then analyze.`);
                    };
                    reader.onerror = () => setStatus(`Could not read ${file.name}.`, true);
                    reader.readAsText(file);
                });

                if (includeGlobal) {
                    document.getElementById("print-analysis").addEventListener("click", () => window.print());
                    document.getElementById("reset-layout").addEventListener("click", resetDashboardLayout);
                    const resizePlots = debounce(() => leveragePlots(currentLeverageFraction()), 240);
                    window.addEventListener("resize", resizePlots);
                    window.addEventListener("beforeprint", () => leveragePlots(currentLeverageFraction()));
                    window.addEventListener("afterprint", () => setTimeout(() => leveragePlots(currentLeverageFraction()), 120));
                }
            };

            const setDefaultDates = () => {
                const today = new Date();
                const todayText = today.toISOString().slice(0, 10);
                const start = new Date(today);
                start.setFullYear(start.getFullYear() - 5);
                document.getElementById("binance-end").value = todayText;
                document.getElementById("binance-start").value = start.toISOString().slice(0, 10);
            };

            document.addEventListener("DOMContentLoaded", () => {
                document.getElementById('analysis-controls').innerHTML =
                    `<section id="source-controls" class="control-panel" aria-label="Return series source">${sourceWidget}</section>` +
                    `<section id="leverage-controls" class="control-panel" aria-label="Kelly leverage">${sliderWidget}</section>`;
                GridStack.renderCB = (element, widget) => {
                    element.innerHTML = widget.content || "";
                    element.closest(".grid-stack-item")?.classList.toggle("no-print", Boolean(widget.noPrint));
                };
                dashboardGrid = GridStack.init(
                    {
                        column: 12,
                        margin: 12,
                        cellHeight: 82,
                        acceptWidgets: false,
                        animate: false,
                        float: false,
                        resizable: { handles: "e,se,s,sw,w" },
                        draggable: { handle: ".panel-header" },
                        columnOpts: {
                            breakpointForWindow: false,
                            breakpoints: [
                                { w: 700, c: 1 },
                                { w: 1000, c: 6 },
                                { w: 5000, c: 12 },
                            ],
                        },
                    },
                    "#simple-grid"
                );
                dashboardGrid.load(layoutCopy());
                wireTabs();
                wireControls();
                setDefaultDates();
                refreshCustomColumnOptions({ preserve: false });
                initializeGauges();
                const redrawSizedPanels = debounce(() => {
                    if (isResettingLayout) return;
                    leveragePlots(currentLeverageFraction());
                }, 90);
                dashboardGrid.on("resizestop", redrawSizedPanels);
                dashboardGrid.on("dragstop", redrawSizedPanels);
                dashboardGrid.on("change", redrawSizedPanels);
                requestAnimationFrame(() => {
                    runSample();
                    setTimeout(() => leveragePlots(currentLeverageFraction()), 180);
                });
            });
        })();
    </script>
</body>

</html>
